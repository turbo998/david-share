name: sync-subrepos
on:
  push:
    branches: [master]
  workflow_dispatch:
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Push subrepos
        env:
          MOE_DEPLOY_KEY_B64: ${{ secrets.MOE_DEPLOY_KEY_B64 }}
          AIPC_DEPLOY_KEY_B64: ${{ secrets.AIPC_DEPLOY_KEY_B64 }}
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          echo "$MOE_DEPLOY_KEY_B64" | base64 -d > ~/.ssh/moe_key
          chmod 600 ~/.ssh/moe_key
          echo "$AIPC_DEPLOY_KEY_B64" | base64 -d > ~/.ssh/aipc_key
          chmod 600 ~/.ssh/aipc_key
          git init --bare /tmp/sync
          cd /tmp/sync
          git remote add source https://github.com/turbo998/david-share.git
          git fetch source refs/heads/Large-MoE-Precision-and-Deployment-Guide:refs/heads/moe refs/heads/AIPC-Decision-Model-Finetune:refs/heads/aipc
          GIT_SSH_COMMAND="ssh -i ~/.ssh/moe_key -o IdentitiesOnly=yes" git push --force git@github.com:turbo998/Large-MoE-Precision-and-Deployment-Guide.git refs/heads/moe:refs/heads/main refs/heads/moe:refs/heads/master
          GIT_SSH_COMMAND="ssh -i ~/.ssh/aipc_key -o IdentitiesOnly=yes" git push --force git@github.com:turbo998/AIPC-Decision-Model-Finetune.git refs/heads/aipc:refs/heads/main refs/heads/aipc:refs/heads/master